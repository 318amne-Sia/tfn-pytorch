[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tfn"
version = "0.1.0"
description = "Tensor Field Networks (Thomas et al. 2018) 的 PyTorch 移植"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/318amne-Sia/tfn-pytorch"
Upstream = "https://github.com/tensorfieldnetworks/tensorfieldnetworks"
Paper = "https://arxiv.org/abs/1802.08219"

# src layout：套件不在 repo 根目錄，所以本機跑測試時 import 到的
# 一定是「安裝後」的那一份，跟 Colab 上的情況一致。
[tool.hatch.build.targets.wheel]
packages = ["src/tfn"]

[dependency-groups]
# 只在本機開發時用。Colab 那端以 --no-deps 安裝，完全不會碰到這組。
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "pyright>=1.1.400",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 預設會跑；要跳過實際訓練用 `uv run pytest -m "not slow"`
markers = ["slow: 需要實際訓練，數十秒等級"]

[tool.ruff]
line-length = 100
# reference/ 是上游原碼，唯讀對照用，不歸我們管
extend-exclude = ["reference"]

[tool.ruff.lint]
# E/W 排版, F 實質問題, I import 排序, UP 過時寫法, B 常見 bug 模式
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
# basic 而非 strict：torch 的型別標註不完整，strict 會對合法程式碼吠很多
typeCheckingMode = "basic"
# 用 requires-python 的下限檢查，這樣不小心用到 3.11+ 語法會被擋
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
